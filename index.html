<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Deluxe Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <main class="game-board">
            <header class="top-bar">
                <h1>B L A C K J A C K</h1>
            </header>

            <section class="hand-area dealer-area">
                <h2>CRUPIER <span id="dealer-score" class="score-badge">?</span></h2>
                <div class="hand" id="dealer-hand"></div>
            </section>

            <div class="table-divider"></div>

            <section class="players-container" id="players-container"></section>
        </main>

        <aside class="sidebar">
            <!-- NUEVA TABLA DE ESTADÍSTICAS POR JUGADOR -->
            <div class="stats-box">
                <h3>ESTADÍSTICAS (G / P / E)</h3>
                <div class="stats-grid" id="stats-grid">
                    <!-- Inyectado por JS -->
                </div>
            </div>

            <div class="seats-box">
                <h3>ASIENTOS</h3>
                <div class="seat dealer-seat-box">● DEALER</div>
                <div id="player-seats-list" class="player-seats-list"></div>
            </div>

            <div class="balance-box">
                <h3>SALDO ACTUAL</h3>
                <div class="money" id="balance-display">$5.00</div>
            </div>
        </aside>
    </div>

    <!-- CONTROLES -->
    <div class="controls">
        <div id="bet-controls" class="control-group">
            <div class="bet-display">
                Apuesta: $<input type="text" id="current-bet" value="1.00" style="width: 120px;">
            </div>
            <button id="btn-bet-minus1">- $1.00</button>
            <button id="btn-bet-minus">- $0.25</button>
            <button id="btn-bet-plus">+ $0.25</button>
            <button id="btn-bet-plus1">+ $1.00</button>
            <button id="btn-bet-max">Max</button>
            <button id="btn-deal" class="primary">Repartir</button>
        </div>

        <div id="action-controls" class="control-group hidden">
            <button id="btn-hit">PEDIR [H]</button>
            <button id="btn-stand">PLANTAR [S]</button>
            <button id="btn-double">DOBLAR [D]</button>
        </div>

        <div id="result-message" class="hidden"></div>
        <button id="btn-next-round" class="primary hidden">Siguiente Ronda</button>
    </div>

    <!-- MODAL EN 2 PASOS -->
    <div id="name-modal" class="modal">
        <div class="modal-content">
            <div id="step-mode">
                <h2>Modo de Juego</h2>
                <p>Elige cómo quieres jugar</p>
                <div class="mode-btns">
                    <button class="btn-mode primary" data-mode="local">Local (Pasar dispositivo)</button>
                    <button class="btn-mode primary" data-mode="bots">Contra Bots</button>
                </div>
            </div>
            
            <div id="step-config" class="hidden">
                <h2 id="config-title">Configuración</h2>
                <div class="input-group">
                    <label id="lbl-count">Número de jugadores:</label>
                    <select id="input-players">
                        <option value="1">1</option>
                        <option value="2" selected>2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>
                <div id="names-container"></div>
                <button id="btn-start" class="primary" style="margin-top: 15px; width: 100%;">Comenzar Juego</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
