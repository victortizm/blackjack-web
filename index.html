<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Deluxe Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <main class="game-board">
            <header class="top-bar">
                <h1>B L A C K J A C K</h1>
            </header>

            <section class="hand-area dealer-area">
                <h2>CRUPIER <span id="dealer-score" class="score-badge">?</span></h2>
                <div class="hand" id="dealer-hand"></div>
            </section>

            <div class="table-divider"></div>

            <section class="players-container" id="players-container">
                <!-- Jugadores inyectados por JS -->
            </section>
        </main>

        <aside class="sidebar">
            <div class="stats-box">
                <h3>ESTADÍSTICAS</h3>
                <p>Ganadas: <span id="stat-wins">0</span></p>
                <p>Perdidas: <span id="stat-losses">0</span></p>
                <p>Empates: <span id="stat-pushes">0</span></p>
                <p>Blackjacks: <span id="stat-blackjacks" style="color: #ffd700;">0</span></p>
            </div>

            <div class="seats-box">
                <h3>ASIENTOS</h3>
                <div class="seat dealer-seat-box">● DEALER</div>
                <div id="player-seats-list" class="player-seats-list"></div>
            </div>

            <div class="balance-box">
                <h3>SALDO ACTUAL</h3>
                <div class="money" id="balance-display">$5.00</div>
            </div>
        </aside>
    </div>

    <!-- CONTROLES -->
    <div class="controls">
        <div id="bet-controls" class="control-group">
            <div class="bet-display">Apuesta: <span id="current-bet">$1.00</span></div>
            <button id="btn-bet-minus">- $0.25</button>
            <button id="btn-bet-plus">+ $0.25</button>
            <button id="btn-bet-plus1">+ $1.00</button>
            <button id="btn-bet-max">Max</button>
            <button id="btn-deal" class="primary">Repartir</button>
        </div>

        <div id="action-controls" class="control-group hidden">
            <button id="btn-hit">PEDIR [H]</button>
            <button id="btn-stand">PLANTAR [S]</button>
            <button id="btn-double">DOBLAR [D]</button>
        </div>

        <div id="result-message" class="hidden"></div>
        <button id="btn-next-round" class="primary hidden">Siguiente Ronda</button>
    </div>

    <!-- MODAL EN 2 PASOS -->
    <div id="name-modal" class="modal">
        <div class="modal-content">
            <!-- PASO 1: Jugadores -->
            <div id="step-players">
                <h2>¿Cuántos jugadores?</h2>
                <p>Selecciona la cantidad (1 a 4)</p>
                <div class="player-btns">
                    <button class="btn-p-count primary" data-count="1">1</button>
                    <button class="btn-p-count primary" data-count="2">2</button>
                    <button class="btn-p-count primary" data-count="3">3</button>
                    <button class="btn-p-count primary" data-count="4">4</button>
                </div>
            </div>
            
            <!-- PASO 2: Nombre -->
            <div id="step-name" class="hidden">
                <h2>Ingresa tu nombre</h2>
                <p id="player-role-text">Serás el Jugador 1</p>
                <input type="text" id="input-name" placeholder="Tu nombre" autocomplete="off" maxlength="10">
                <button id="btn-start" class="primary" style="margin-top: 15px; width: 100%;">Comenzar Juego</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
