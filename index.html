<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Deluxe Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Zona de Juego (Izquierda) -->
        <main class="game-board">
            <header class="top-bar">
                <h1>B L A C K J A C K</h1>
                <div class="dealer-score" id="dealer-score">Crupier: ?</div>
            </header>

            <section class="hand-area dealer-area">
                <h2>CRUPIER</h2>
                <div class="hand" id="dealer-hand"></div>
            </section>

            <div class="separator"></div>

            <section class="hand-area player-area">
                <h2>TÚ <span id="player-name-display">Jugador</span></h2>
                <div class="hand" id="player-hand"></div>
                <div class="score" id="player-score">Total: 0</div>
            </section>
        </main>

        <!-- Panel Lateral (Derecha) -->
        <aside class="sidebar">
            <div class="stats-box">
                <h3>ESTADÍSTICAS</h3>
                <p>Ganadas: <span id="stat-wins">0</span></p>
                <p>Perdidas: <span id="stat-losses">0</span></p>
                <p>Empates: <span id="stat-pushes">0</span></p>
            </div>

            <div class="seats-box">
                <h3>ASIENTOS</h3>
                <div class="seat dealer-seat">● Crupier</div>
                <div class="seat player-seat" id="seat-player">○ Vacío</div>
                <div class="seat empty-seat">○ Vacío</div>
                <div class="seat empty-seat">○ Vacío</div>
            </div>

            <div class="balance-box">
                <h3>SALDO</h3>
                <div class="money" id="balance-display">$5.00</div>
            </div>
        </aside>
    </div>

    <!-- Controles Flotantes (Abajo) -->
    <div class="controls">
        <!-- Fase de Apuesta -->
        <div id="bet-controls" class="control-group">
            <div class="bet-display">Apuesta: <span id="current-bet">$1.00</span></div>
            <button id="btn-bet-minus">- $0.25</button>
            <button id="btn-bet-plus">+ $0.25</button>
            <button id="btn-bet-max">Max</button>
            <button id="btn-deal" class="primary">Aceptar y Repartir</button>
        </div>

        <!-- Fase de Juego -->
        <div id="action-controls" class="control-group hidden">
            <button id="btn-hit">PEDIR [H]</button>
            <button id="btn-stand">PLANTAR [S]</button>
            <button id="btn-double">DOBLAR [D]</button>
        </div>

        <!-- Mensaje de Resultado -->
        <div id="result-message" class="hidden"></div>
        
        <!-- Botón de Siguiente Ronda -->
        <button id="btn-next-round" class="primary hidden">Siguiente Ronda</button>
    </div>

    <!-- Modal para pedir nombre -->
    <div id="name-modal" class="modal">
        <div class="modal-content">
            <h2>Bienvenido a Blackjack</h2>
            <p>Ingresa tu nombre:</p>
            <input type="text" id="input-name" placeholder="Tu nombre" autocomplete="off">
            <button id="btn-start" class="primary">Comenzar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
